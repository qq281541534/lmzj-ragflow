name: build-images

# 仅从发布源 dev 构建不可变完整 SHA 镜像并推送 ACR。
# non-runtime 变更（docs / process / release-governance）不 login / build / push。
# 生产部署是独立关口，本 workflow 不部署。

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      force_build:
        description: "强制构建（忽略 change-scope 跳过）"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect-change-scope:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.scope.outputs.build_needed }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute scope
        id: scope
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "无法可靠 diff，保守按需构建（unknown）"
            echo "scope=unknown" >> "$GITHUB_OUTPUT"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "${BEFORE}" "${{ github.sha }}")
            echo "Changed files:"; echo "${CHANGED}"
            echo "${CHANGED}" | python3 scripts/detect_change_scope.py
          fi

  verify-source:
    needs: detect-change-scope
    if: ${{ needs.detect-change-scope.outputs.build_needed == 'true' || inputs.force_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 commit 来自合并进 dev 的 PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: dev
        run: python3 scripts/check_image_build_source.py "${{ github.sha }}"

  build-and-push:
    needs: [detect-change-scope, verify-source]
    if: ${{ needs.detect-change-scope.outputs.build_needed == 'true' || inputs.force_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate full 40-char SHA
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "${SHA}" | grep -Eq '^[0-9a-f]{40}$' || { echo "非法 SHA: ${SHA}"; exit 1; }

      # RAGFlow 完整镜像约 9GB，免费托管 runner 默认磁盘不足，先回收空间。
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # Dockerfile 使用 BuildKit 语法（--mount=type=bind,from=... / cache mounts），需 buildx。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push immutable image
        env:
          # 构建在境外托管 runner 上跑，使用默认全球源；NEED_MIRROR=1 会切到阿里云镜像（境内快、境外慢）。
          NEED_MIRROR: "0"
        run: |
          set -euo pipefail
          IMAGE="${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY }}:${{ github.sha }}"
          # 注：阿里云 ACR 不支持 buildkit registry 层缓存 manifest（denied: unknown manifest
          # class for application/vnd.buildkit.cacheconfig.v0），故不用 --cache-to type=registry。
          # 镜像更新通过 maintenance-swap 处理（停 ragflow-cpu → 删旧镜像腾盘 → 拉新 → 起，见 runbook）。
          echo "Building ${IMAGE}"
          docker buildx build \
            --build-arg NEED_MIRROR="${NEED_MIRROR}" \
            -t "${IMAGE}" \
            -f Dockerfile \
            --push \
            --metadata-file /tmp/build-meta.json \
            .
          DIGEST=$(python3 -c "import json;print(json.load(open('/tmp/build-meta.json')).get('containerimage.digest','n/a'))" 2>/dev/null || echo 'n/a')
          {
            echo "### 镜像已构建并推送"
            echo "- \`${IMAGE}\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  skip-note:
    needs: detect-change-scope
    if: ${{ needs.detect-change-scope.outputs.build_needed != 'true' && !inputs.force_build }}
    runs-on: ubuntu-latest
    steps:
      - name: Non-runtime change — 跳过镜像构建
        run: |
          echo "scope=${{ needs.detect-change-scope.outputs.scope }} → 不构建/推送生产镜像"
          echo "### 跳过镜像构建（${{ needs.detect-change-scope.outputs.scope }}）" >> "$GITHUB_STEP_SUMMARY"
